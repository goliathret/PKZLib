name: pkztool

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - run: cmake --build build --config Release --target pkztool
      - uses: actions/upload-artifact@v4
        with:
          name: pkztool-${{ runner.os }}
          path: |
            build/pkztool
            build/Release/pkztool.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          chmod +x pkztool-*/pkztool
          for d in pkztool-*; do zip -rj "$d.zip" "$d"; done
          gh release create "$GITHUB_REF_NAME" pkztool-*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
